<script>
    //Variables for counters
    var counter = 0;
    var guesses = 0;
    var revision_sentence;
    var the_timer;
    var Interval = null;
    var isInternalSR = true;
    var correctnessData = {'part1': [], 'part2':[]}; //tracks data for sending at end of stuff
    var orderPart1 = [];
    var orderPart2 = [];
    var temp_holder;

    //Variables for student data from first page
    var Snumber;

    //Global vars for listening / speaking
    var language_var = 'en-US';
    var languageVoice = '';
    let voices = [];
    const options = document.getElementById('voices');
    const hasSynth = 'speechSynthesis' in window
    if (hasSynth) {
    voices = speechSynthesis.getVoices()
    
    speechSynthesis.addEventListener('voiceschanged', () => {
        voices = speechSynthesis.getVoices()
    })
    }
    
    //get the voices on 5sec timeout
    window.onload = function () { 
        setTimeout(GetVoices, 3000);
    }

    //Provides the listening via text-to-speech; takes a string as an argument.
    function Listen(word) {
        //Cancel current / previous speech synthesis
        if (window.speechSynthesis.speaking) { 
            window.speechSynthesis.cancel(); 
        }
        let utter = new SpeechSynthesisUtterance();
        utter.lang = language_var;
        utter.voice = voices.find(voice=> voice.name === options.value);
        utter.text = word;
        window.speechSynthesis.speak(utter);
        utter.onend = function(event) {
            if (document.getElementById('Part2Holder').style.display=="block"){
                triggerSpeach();
            }
        };
    }

    //Handles voice options - I usually use it with a timeout; if this is called TOO early, it will be called before the voices load and then it will be blank.
    function GetVoices(){
        const initOpt = document.createElement('option')
        if (!voices.length && hasSynth) {
        voices = speechSynthesis.getVoices()
        }
        initOpt.append(document.createTextNode('-- 声を選んでください --'))
        options.append(initOpt)
        voices.forEach(voice => {
        const option = document.createElement('option')
        option.value = voice.name;
        if (voice.lang.includes('en')) {
                var forkids = '';
                if(voice.lang = "en-GB"){
                    forkids = "British English"
                } if (voice.lang = "en-US") {
                    forkids = "American English"
                } else {forkids = voice.lang}
                option.append(document.createTextNode(`${forkids} : ${voice.name}`))
                options.append(option)
            }
        })
        options.style.display = 'inline';
        document.getElementById('waitingASR').style.display="none";
    }

    //Plays an example when a new voice is selected
    function selectVoice(){
        Listen("Hello, this is my voice.");
    }

    function startTimer() {
        if (Interval === null) {
            Interval = setInterval(function() {
            the_timer++;
            }, 100); // 100 ms = 0.1 seconds
        }
    }

    function stopTimer() {
        if (Interval !== null) {
            clearInterval(Interval);
            Interval = null;
        }
    }

    function displayCorrectness(correctness){ //correctness is true/false true=correct
        stopTimer();
        guesses++;
        if (correctness==true){
            document.getElementById('correctnessModalContent').classList="w3-center w3-green";
            document.getElementById('correctnessModalContent').innerHTML="正解！";
            let first = correctnessData.part1.length;
            correctnessData.part1.push({'qNo': orderPart1[first],'guesses':guesses,'RT':the_timer/10});
            setTimeout(()=>{
                document.getElementById('correctnessModal').style.display="none";
                finishPictureQuestion();
            }, 1300);
            
        } else {
            document.getElementById('correctnessModalContent').classList="w3-center w3-red";
            document.getElementById('correctnessModalContent').innerHTML="不正解！";
            setTimeout(()=>{
                document.getElementById('correctnessModal').style.display="none";
                startTimer();
            }, 1300);
        }
        document.getElementById('correctnessModal').style.display="block";

    }
    
    function truePart1Start(){
        document.getElementById('part1StartButton').style.display='none'; //hide the start button
        document.getElementById('part1AllStuff').style.display='block'; //display main stuff
        orderPart1 = randomize(theData.length);
        constructPictureQuestion(orderPart1[0]);
    }

    function finishPictureQuestion(){
        if (correctnessData.part1.length < theData.length){
            constructPictureQuestion(orderPart1[correctnessData.part1.length]); //set the next question
        } else { //if we're finished, go to the next one
            document.getElementById('Part1Holder').style.display="none";
            document.getElementById('Part2Holder').style.display="block";
        }
    }

    function userAnswered(choice){
        let currentQuestion = correctnessData.part1.length;
        let answerChoice = parseInt(choice.charAt(8));
        //displayCorrectness(data.pictures[currentQuestion].pictures[0]==data.pictures[currentQuestion].pictures[0]);
        displayCorrectness(answerChoice==0);
    }

    function constructPictureQuestion(number){
        guesses = 0;
        the_timer = 0;
        document.getElementById('part1Pictures').innerHTML="";
        let thisOrder = randomize(4);

        const container = document.createElement("div");

        // First row
        const row1 = document.createElement("div");
        row1.className = "w3-cell-row-padding";
        for (let i = 0; i < 2; i++) {
            const half = document.createElement("div");
            half.className = "w3-half w3-center w3-cell-middle";
            half.style.width="50%";
            const img = document.createElement("img");
            img.id = `picture0${i}`;
            img.className = "pictureQuestion";
            img.src = theData[number].pictures[GetOriginal(i,thisOrder)];
            img.setAttribute("onclick", `userAnswered('picture0${GetOriginal(i,thisOrder)}')`);

            half.appendChild(img);
            row1.appendChild(half);
        }
        container.appendChild(row1);

        // Second row
        const row2 = document.createElement("div");
        row2.className = "w3-cell-row-padding";

        for (let i = 2; i < 4; i++) {
            const innerHalf = document.createElement("div");
            innerHalf.className = "w3-half w3-center w3-cell-middle";
            innerHalf.style.width="50%";
            const img = document.createElement("img");
            img.id = `picture0${i}`;
            img.className = "pictureQuestion";
            img.src = theData[number].pictures[GetOriginal(i,thisOrder)];
            img.setAttribute("onclick", `userAnswered('picture0${GetOriginal(i,thisOrder)}')`);

            innerHalf.appendChild(img);
            row2.appendChild(innerHalf);
        }
        container.appendChild(row2);

        // Add a <br>
        container.appendChild(document.createElement("br"));

        // Append to body or another element
        document.getElementById('part1Pictures').appendChild(container);
        startTimer();
        Listen(theData[number].word);
    }

    function relisten(){
        Listen(theData[correctnessData.part1.length].word)
    }
    function relisten2(){
        Listen(theData[correctnessData.part2.length].word)
    }

    //Matches the needle in the haystack (array) and returns what is required
    function GetOriginal(needle, haystack){
        for (let i=0; i<haystack.length; i++){
            if (haystack[i] == needle){
                return (i);
            }
        }
    }
    

    
    //Switches to the problem / test
    function StartTest(){
        //Ensures students entered data and throws errors if they haven't 
        if (document.getElementById('snumber').value == ""){
            document.getElementById('number_error').style.display = "block";
        } else {
            document.getElementById('beginner').style.display = "none";
            document.getElementById('real_stuff').style.display = "block";
        }
    }

   
    //Sends data; for this demo, it simply writes it in an alert box
    function SendAll(){
        Snumber = document.getElementById('snumber').value;
        console.log(correctnessData);
        document.getElementById('Part3Holder').style.display="block";
        document.getElementById('part3Pictures').innerHTML = "Part 1: 絵と英語のマッチング";
        for (let i = 0; i < correctnessData.part1.length; i++) {
            for (let item of correctnessData.part1) {
                if (item.qNo === i) {
                    document.getElementById('part3Pictures').innerHTML += "<br> Question "+(i+1)+": "+item.guesses+"回で正解できた。"+item.RT+"秒かかった。"
                    break; // stop after finding the match
                }
            }
        }
        document.getElementById('part3Pictures').innerHTML += "<br><br>Part 2: スピーキング";
        for (let i = 0; i < correctnessData.part2.length; i++) {
            for (let item of correctnessData.part2) {
                if (item.qNo === i) {
                    document.getElementById('part3Pictures').innerHTML += "<br> Question "+(i+1)+": 正解率は"+(item.correctness*100).toFixed(0)+"％でした。1秒に"+item.SR+"音節の速度で発音できた。"
                    break; // stop after finding the match
                }
            }
        }
        google.script.run.userFinished(Snumber, correctnessData);

    }

    
    //Controls the initial test ASR
    function TesttheASR(){
        document.getElementById('yo').style.display = "inline";
        document.getElementById('testing123').innerHTML = "試行中...";
        testASR();
        test_run.start();
    }
    function testASR(){
        //Try to grab speech recognition and show preference for internal device
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        test_run = new SpeechRecognition();
        if (!test_run){
            test_run = new webkitSpeechRecognition();
        isInternalSR = false;
        }
        //Set up speech recognition. Important! For internal android devices, interm must be turned off!
        test_run.continuous = true;
        test_run.lang = 'en-US';
        if (isInternalSR == false){
            test_run.interimResults = true;
        } else {
            test_run.interimResults = false;
        }
        test_run.onerror = (event) => {
        console.log(event.error);
        ASRerrorHandle(event.error);
        };
        test_run.onresult = disp_test;
        }
        function disp_test(event){
            var results = event.results;
            for (var i = event.resultIndex; i < results.length; ++i) {
                if (results[i].isFinal) {
                    if (results[i][0].transcript){
                        document.getElementById('testing123').innerHTML = "このデバイスで問題なくスピーキング練習はできます。";
                        document.getElementById('testing123').className = "w3-center w3-green";
                    } else {
                        document.getElementById('testing123').innerHTML = "お使いのデバイスが音声を正しく認識できていないようです。再度お試しいただくか、別のデバイスをご使用いただくか、必要に応じてサポートをご利用ください。";
                        document.getElementById('testing123').className = "w3-center w3-red";
                    }
                    test_run.stop();
                } 
            }
    }

    function triggerSpeach(){
        StartASR();
        recognition.start();
        setTimeout(()=>{
            document.getElementById('part2Pictures').innerHTML="<span style='color:green'><b>話してください</b></span>";
            startTimer();
        }, 1000);
    }

    function makeSpeakingQuestion(number){
        the_timer=0;
        Listen(theData2[number]);
        document.getElementById('whatToSay').innerHTML=theData2[number];
        document.getElementById('part2Pictures').innerHTML="<span style='color:red'><b>待ってください...</b></span> <br><img style='max-height:200px' src='https://springsenglish.online/dumbNLP/Spinning.gif'></img>";
    }

    function truePart2Start(){
        document.getElementById('part2StartButton').style.display='none'; //hide the start button
        document.getElementById('part2AllStuff').style.display='block'; //display main stuff
        orderPart2 = randomize(theData2.length);
        makeSpeakingQuestion(orderPart2[0]);
    }

    function analyzeSpeaking(words){
        console.log(theData2[orderPart2[correctnessData.part2.length]]);
        stopTimer();
        let PassArray = ProvideWords(theData2[orderPart2[correctnessData.part2.length]]);
        let originalWords = ProvideWordsWithPunctuation(theData2[orderPart2[correctnessData.part2.length]]);
        let spkArray = ProvideWords(words);
        let passObject = DifferentWordsPreprocessed(PassArray);
        let dwArray = [];
        let dwNumbers = [];
        for (let [key, value] of passObject.DWCounts){
            dwArray.push(key);
            dwNumbers.push(value);
        }

        let correctTWs = [];
        let extraWords = 0;
        for (let i=0; i<spkArray.length; i++){
            let found = false;
            for (let j=0; j<dwArray.length; j++){
                if (spkArray[i] == dwArray[j]){
                    correctTWs.push(spkArray[i]);
                    found = true;
                }
            }
            if (found == false){
                extraWords +=1;
            }
        }

        let correctCount = 0;
        let correctWords = [];
        let correctCounts = DifferentWordsPreprocessed(correctTWs);
        for (let [key, value] of passObject.DWCounts){
            if (correctTWs.includes(key)){
                if (correctCounts.DWCounts.get(key) <= value){
                    correctCount += correctCounts.DWCounts.get(key);
                } else {
                    correctCount += value;
                    extraWords += (correctCounts.DWCounts.get(key) - value);
                }
            }
        }

        let penalizedCorrect = safeDivision((correctCount - extraWords), PassArray.length);
        let spokenCorrect = safeDivision(correctCount, PassArray.length);
        let syl_count = countSyllablesArray(spkArray);
        let sps;
        if (the_timer == 0){
            sps = syl_count / 0.5;
        } else {
            sps = syl_count / (the_timer/10);
        }
        sps = sps.toFixed(2);
        correctnessData.part2.push({'qNo': orderPart2[(correctnessData.part2.length)], 'correctness':spokenCorrect, 'penPct':penalizedCorrect,'SR':sps, 'syllables':syl_count, 'words': words});
        setTimeout(()=>{
            document.getElementById('correctnessModal').style.display="none";
            finishSpeakingQuestion();
        }, 1700);
        document.getElementById('correctnessModal').style.display="block";
        document.getElementById('correctnessModalContent').classList="w3-center w3-white";
        document.getElementById('correctnessModalContent').innerHTML="";
        let tempItem = document.createElement('p');
        console.log(PassArray);
        console.log(originalWords);
        console.log(correctTWs);
        for (let q=0; q<PassArray.length; q++){
            let wordIn = correctTWs.includes(PassArray[q]);
            if (wordIn == true){
                tempItem.innerHTML += `<b><span style="color: rgb(0, 153, 51);">${originalWords[q]}</span> </b> `;
            } else {
                tempItem.innerHTML += "<b><span style='color: rgb(230, 0, 0);'>"+originalWords[q]+"</span> </b> ";
            }
        }
        document.getElementById('correctnessModalContent').appendChild(tempItem)

    }

    function finishSpeakingQuestion(){
        if (correctnessData.part2.length < theData.length){
            makeSpeakingQuestion(orderPart2[correctnessData.part2.length]); //set the next question
        } else { //if we're finished, go to the next one
            document.getElementById('Part1Holder').style.display="none";
            document.getElementById('Part2Holder').style.display="none";
            SendAll();
        }
    }
    
    //Main ASR start
    function StartASR(){
        console.log('startASR fired');
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        if (!recognition){
            recognition = new webkitSpeechRecognition();
            isInternalSR = false;
        }
        recognition.continuous = false;
        recognition.lang = language_var;
        if (isInternalSR == false){
            recognition.interimResults = true;
        } else {
            recognition.interimResults = false;
        }
        recognition.onerror = (event) => {
            console.log(event.error);
            ASRerrorHandle(event.error);
        };
        recognition.onresult = disp;
    }
            function disp(event) {
                console.log('disp fired')
                var results = event.results;
                for (var i = event.resultIndex; i < results.length; ++i) {
                    if (results[i].isFinal) {
                        analyzeSpeaking(results[i][0].transcript);
                    } 
                }
            }  


    //Function that feeds all the various randomizers.
    function randomize(x){
        var answers = [];
        for (let i=0; i<x; i++){
            answers.push(i);
        }
        var random_order = [];
        var db = [];
        for (let i=0; i<x; i++) {
                let temp = Math.random();
                random_order.push(temp);
            }
        for (let i=0; i<x; i++) {
                db.push({"rank": answers[i], "number": random_order[i]});
            }
        var sorted = db.slice().sort((a, b) => a.number - b.number);
        answers = [];
        for (let i=0; i<x; i++){
            answers.push(sorted[i].rank);
        }
        return (answers)
    }
